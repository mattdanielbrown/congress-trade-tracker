name: Daily Data Ingestion

on:
  schedule:
    # Run every day at 06:00 UTC (1 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ingest-and-enrich:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run Ingestion Script
        env:
          VITE_CONGRESS_API_KEY: ${{ secrets.VITE_CONGRESS_API_KEY }}
        run: node bin/ingest_congress.js
        
      - name: Run Enrichment Script
        env:
          VITE_ALPHA_VANTAGE_API_KEY: ${{ secrets.VITE_ALPHA_VANTAGE_API_KEY }}
          VITE_POLYGON_API_KEY: ${{ secrets.VITE_POLYGON_API_KEY }}
        run: node bin/enrich_trades.js
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/*.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(data): auto-update congress trade data"
          git push
